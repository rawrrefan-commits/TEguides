<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>License Login • Top Eleven Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 14px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#172b4d;background:linear-gradient(145deg,#eef5fc,#c9dcef)}.card{width:100%;max-width:420px;padding:28px 22px 24px;border-radius:15px;background:rgba(255,255,255,.96);box-shadow:0 16px 40px rgba(26,64,103,.2)}.logo{width:62px;height:62px;margin:0 auto 13px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#173d76,#286cb4);color:#fff;font-size:28px}h1{margin:0;text-align:center;color:#183b72;font-size:23px;font-weight:800;text-transform:uppercase}.subtitle{margin:7px 0 22px;text-align:center;color:#7890ad;font-size:12px;line-height:1.45}label{display:block;margin-bottom:7px;color:#274c78;font-size:13px;font-weight:800;text-transform:uppercase}input{width:100%;height:48px;padding:0 13px;border:2px solid #d3dfec;border-radius:9px;background:#fff;color:#173d76;font-size:16px;font-weight:800;outline:none;text-align:center;letter-spacing:1px}input:focus{border-color:#2874c6;box-shadow:0 0 0 3px rgba(40,116,198,.12)}button{width:100%;height:48px;margin-top:11px;border:0;border-radius:9px;background:linear-gradient(135deg,#2874c6,#175aa3);color:#fff;font-size:14px;font-weight:800;text-transform:uppercase;cursor:pointer}.status{display:none;margin-top:11px;padding:9px 10px;border-radius:7px;font-size:12px;text-align:center}.status.show{display:block}.error{color:#a32929;background:#fff0f0}.success{color:#176b31;background:#eaf8ee}.info{margin-top:17px;padding-top:14px;border-top:1px solid #e5edf5;text-align:center;color:#7890ad;font-size:11px;line-height:1.5}</style></head><body><div class="card"><div class="logo">⚽</div><h1>Top Eleven Calculator</h1><div class="subtitle">Masukkan License Key untuk membuka kalkulator.</div><form id="licenseForm"><label for="licenseKey">License Key</label><input id="licenseKey" type="text" autocomplete="off" placeholder="TE2026-XXXX-XXXX" spellcheck="false"><button type="submit">🔓 Masuk ke Calculator</button></form><div id="status" class="status"></div><div class="info">Demo key saat ini: <b>TE2026-ACCESS-001</b><br>Untuk key berbayar sungguhan, validasi perlu backend/database.</div></div><script>const VALID_KEY="TE2026-ACCESS-001",form=document.getElementById("licenseForm"),input=document.getElementById("licenseKey"),status=document.getElementById("status");function show(m,c){status.textContent=m;status.className="status show "+c}form.addEventListener("submit",e=>{e.preventDefault();const key=input.value.trim();if(!key)return show("Masukkan License Key terlebih dahulu.","error");if(key===VALID_KEY){localStorage.setItem("topElevenLicenseVerified",VALID_KEY);show("License valid. Membuka calculator...","success");setTimeout(()=>location.replace("index.html"),450)}else{show("License Key tidak valid atau belum terdaftar.","error");input.select()}});</script></body></html>
