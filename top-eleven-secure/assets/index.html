<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Login Key — Top Eleven Calculator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#eef5fc 0%,#dce9f7 48%,#c9dcef 100%)}
.card{width:100%;max-width:360px;background:rgba(255,255,255,.96);border-radius:14px;padding:28px 24px;text-align:center;box-shadow:0 18px 45px rgba(24,59,114,.16)}
.title{font-size:22px;font-weight:800;color:#173d76}.sub{margin:8px 0 20px;color:#6c88ac;font-size:13px;line-height:1.45}
input{width:100%;height:46px;border:1px solid #c9d8e8;border-radius:9px;padding:0 12px;font-size:14px;outline:none;text-align:center}input:focus{border-color:#2874c6;box-shadow:0 0 0 3px rgba(40,116,198,.12)}
button{width:100%;height:46px;margin-top:11px;border:0;border-radius:9px;background:linear-gradient(135deg,#183b72,#2874c6);color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(24,59,114,.25)}button:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:18px;margin-top:11px;font-size:12.5px;font-weight:600;color:#6c88ac}.error{color:#c93b3b}.success{color:#1f9d55}
.badge{display:inline-flex;margin-top:15px;padding:6px 13px;border-radius:999px;background:linear-gradient(135deg,#183b72,#2874c6);color:#fff;font-size:11px;font-weight:700}
</style>
</head>
<body>
<main class="card">
  <div style="font-size:40px;margin-bottom:9px">🔒</div>
  <div class="title">Masukkan Key Akses</div>
  <div class="sub">Aplikasi ini terkunci. Masukkan key yang valid untuk melanjutkan.</div>
  <input id="keyGateInput" type="text" placeholder="Masukkan key di sini" autocomplete="off" spellcheck="false">
  <button id="keyGateBtn">Masuk</button>
  <div id="keyGateMsg" class="msg"></div>
  <div class="badge">Protected • Firestore Key System</div>
</main>
<script>
const keyInput=document.getElementById("keyGateInput");
const keyBtn=document.getElementById("keyGateBtn");
const keyMsg=document.getElementById("keyGateMsg");
const SAVED_KEY_FLAG="ovr_saved_key";
const DEVICE_ID_FLAG="ovr_device_id";
const LAST_SEEN_FLAG="ovr_last_seen_ms";
const CLOCK_TOLERANCE_MS=5*60*1000;

function getDeviceId(){
  let id=localStorage.getItem(DEVICE_ID_FLAG);
  if(!id){ id="dev-"+crypto.randomUUID(); localStorage.setItem(DEVICE_ID_FLAG,id); }
  return id;
}
function isClockRolledBack(){
  const now=Date.now();
  const lastSeen=parseInt(localStorage.getItem(LAST_SEEN_FLAG)||"0",10);
  if(now<lastSeen-CLOCK_TOLERANCE_MS)return true;
  if(now>lastSeen)localStorage.setItem(LAST_SEEN_FLAG,String(now));
  return false;
}
function setMsg(text,type=""){keyMsg.textContent=text;keyMsg.className="msg "+type}
async function validateAndLogin(inputKey,silent=false){
  if(isClockRolledBack())return {ok:false,message:"Jam perangkat terdeteksi diubah mundur. Sambungkan internet dan coba lagi."};
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",cache:"no-store",body:JSON.stringify({key:inputKey,deviceId:getDeviceId()})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||!data.ok)return {ok:false,message:data.message||"Key tidak valid."};
    localStorage.setItem(SAVED_KEY_FLAG,inputKey);
    return data;
  }catch(e){
    if(!silent)console.error(e);
    return {ok:false,message:"Gagal memeriksa key. Cek koneksi internet / server."};
  }
}
async function checkKey(){
  const inputKey=keyInput.value.trim();
  if(!inputKey){setMsg("Key tidak boleh kosong.","error");return}
  keyBtn.disabled=true;setMsg("Memeriksa key...");
  const result=await validateAndLogin(inputKey);
  if(!result.ok){setMsg(result.message,"error");keyBtn.disabled=false;return}
  setMsg("Key valid! Membuka aplikasi...","success");
  setTimeout(()=>location.replace("/app"),250);
}
keyBtn.addEventListener("click",checkKey);
keyInput.addEventListener("keydown",e=>{if(e.key==="Enter")checkKey()});

(()=>{
  // V3: selalu tampilkan halaman key saat membuka "/".
  // Auto-login sengaja dinonaktifkan agar key gate dapat diuji dengan jelas.
  const params=new URLSearchParams(location.search);
  const notice=params.get("expired");
  if(notice)setMsg(notice,"error");
  keyInput.focus();
})();
</script>
</body>
</html>
