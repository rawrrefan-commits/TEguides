<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitur Utama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --biru-tua:#0a2a6b;
    --biru:#123f9e;
    --biru-terang:#2f6fe0;
    --biru-cerah:#4f8dff;

    /* ==== atur posisi judul + logo di sini ==== */
    --brand-top: 20px;      /* jarak dari atas header */
    --brand-left: 50%;      /* posisi horizontal (50% = tengah) */
    --brand-shift-x: -50%;  /* penyeimbang agar tetap center saat left:50% */
    --brand-gap: 8px;       /* jarak antara logo dan teks judul */
    --logo-size: 44px;      /* ukuran logo */
    --title-size: 25px;     /* ukuran font judul */
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    min-height:100vh;
    background:#eef3fb;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
  }

  .phone{
    width:100%;
    min-height:100vh;
    position:relative;
    background:#eef3fb;
    display:flex;
    flex-direction:column;
    opacity:0;
    animation:masuk .7s ease-out forwards;
  }

  @keyframes masuk{
    to{opacity:1;transform:translateY(0);}
  }

  /* ===================== HEADER ===================== */
  .header{
    position:relative;
    height:230px;
    flex-shrink:0;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(10,30,80,.15) 0%, rgba(10,30,80,.55) 70%, var(--biru-tua) 100%),
      url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1200&q=80') center 30%/cover no-repeat;
  }

  .header::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(115deg,
        rgba(255,255,255,.10) 0px,
        rgba(255,255,255,.10) 2px,
        transparent 2px,
        transparent 26px);
    mix-blend-mode:screen;
    opacity:.5;
  }

  .diagonal-shape{
    position:absolute;
    top:-40%;
    left:-25%;
    width:75%;
    height:180%;
    background:linear-gradient(135deg,var(--biru-terang),var(--biru-tua) 65%);
    clip-path:polygon(0% 0%, 55% 0%, 20% 100%, 0% 100%);
    opacity:.92;
  }
  .diagonal-shape::after{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(135deg,
      rgba(255,255,255,.12) 0 3px,
      transparent 3px 18px);
  }

  .diagonal-shape2{
    position:absolute;
    top:-60%;
    left:8%;
    width:30%;
    height:220%;
    background:linear-gradient(135deg,rgba(79,141,255,.55),rgba(79,141,255,0) 70%);
    clip-path:polygon(0% 0%, 100% 0%, 40% 100%, 0% 100%);
  }

  .dot-grid{
    position:absolute;
    top:0;right:0;
    width:60%;
    height:55%;
    background-image:radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.4px);
    background-size:10px 10px;
    opacity:.35;
    -webkit-mask-image:linear-gradient(200deg, black, transparent 70%);
            mask-image:linear-gradient(200deg, black, transparent 70%);
  }

  .header-bar{
    position:absolute;
    left:0;right:0;bottom:0;
    height:96px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 35%),
      linear-gradient(180deg, var(--biru-terang) 0%, var(--biru) 55%, var(--biru-tua) 100%);
    box-shadow:inset 0 2px 8px rgba(255,255,255,.25);
  }
  .header-bar::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(70deg,
      rgba(255,255,255,.06) 0 2px,
      transparent 2px 14px);
  }

  /* ===================== KARTU LOGIN DAILY STREAK ===================== */
  .streak-card{
    position:relative;
    overflow:hidden;
    margin:-96px 22px 0;
    z-index:5;
    background:
      linear-gradient(135deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(120deg,#4f8dff 0%,#2f6fe0 45%,#0d1f52 100%);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 14px 26px -10px rgba(6,20,60,.65), inset 0 1px 0 rgba(255,255,255,.30);
    text-decoration:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .streak-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(115deg,
      rgba(255,255,255,.12) 0px,
      rgba(255,255,255,.12) 2px,
      transparent 2px,
      transparent 16px);
    opacity:.5;
    pointer-events:none;
  }

  .streak-card::after{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:40%;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-20deg);
    animation:streakShine 3.2s ease-in-out infinite;
    pointer-events:none;
  }

  .streak-glow{
    position:absolute;
    top:-40%;
    right:-15%;
    width:55%;
    height:180%;
    background:radial-gradient(circle, rgba(120,180,255,.45), transparent 70%);
    pointer-events:none;
  }

  @keyframes streakShine{
    0%{left:-60%;}
    35%,100%{left:130%;}
  }

  .streak-card:active{
    transform:scale(.97);
  }

  .streak-icon{
    position:relative;
    flex-shrink:0;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 70%);
    border-radius:50%;
    box-shadow:0 0 0 1px rgba(255,255,255,.18);
  }

  .streak-icon svg{
    width:24px;
    height:24px;
    filter:drop-shadow(0 2px 4px rgba(5,15,45,.45));
    animation:flameFlicker 1.6s ease-in-out infinite;
  }

  @keyframes flameFlicker{
    0%,100%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.08) rotate(-2deg);}
  }

  .streak-text{
    position:relative;
    flex:1;
    min-width:0;
  }

  .streak-title-row{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .streak-title{
    font-family:'Rajdhani',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    color:#ffffff;
    text-transform:uppercase;
    text-shadow:0 1px 3px rgba(5,15,45,.35);
  }

  .streak-sub{
    font-family:'Rajdhani',sans-serif;
    font-size:11px;
    font-weight:600;
    color:rgba(255,255,255,.90);
    margin-top:2px;
  }

  .streak-arrow-wrap{
    position:relative;
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:50%;
    background:rgba(255,255,255,.20);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .streak-arrow{
    width:14px;
    height:14px;
  }

  /* ===================== KARTU KONTEN ===================== */
  .card{
    position:relative;
    flex:1;
    margin-top:0px;
    z-index:4;
    background:
      radial-gradient(120% 60% at 100% 0%, rgba(79,141,255,.10), transparent 55%),
      radial-gradient(120% 60% at 0% 100%, rgba(18,63,158,.08), transparent 55%),
      linear-gradient(180deg,#ffffff 0%, #eef3fb 100%);
    border-radius:0px 0px 0 0;
    box-shadow:0 -12px 24px -14px rgba(10,30,80,.25);
    padding:26px 22px 40px 22px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(18,63,158,.06) 1px, transparent 1.4px);
    background-size:16px 16px;
    pointer-events:none;
  }

  .card-title{
    position:relative;
    font-size:15px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--biru-tua);
    text-transform:uppercase;
  }

  .empty-area{
    position:relative;
    flex:1;
    padding-top:18px;
  }

  /* ===================== GRID MENU FITUR ===================== */
  .menu-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
  }

  .menu-card{
    position:relative;
    background:#ffffff;
    border:1px solid rgba(18,63,158,.08);
    border-radius:12px;
    padding:8px 6px 7px;
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 5px 10px -6px rgba(10,30,80,.20);
    cursor:pointer;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .menu-card:active{
    transform:scale(.97);
  }

  .menu-card-tap{
    animation:tap .16s ease-out;
  }

  @keyframes tap{
    0%{transform:scale(1);}
    50%{transform:scale(.92);}
    100%{transform:scale(1);}
  }

  .menu-icon-wrap{
    position:relative;
    width:20px;
    height:20px;
    margin-bottom:5px;
  }

  .menu-icon-wrap svg{
    width:100%;
    height:100%;
  }

  .menu-card-title{
    font-family:'Rajdhani',sans-serif;
    font-size:8px;
    font-weight:700;
    letter-spacing:.01em;
    color:var(--biru-tua);
    text-transform:uppercase;
    line-height:1.15;
  }

  /* ===================== BRAND / LOGO (di atas header) ===================== */
  .header-brand{
    position:absolute;
    top:var(--brand-top);
    left:var(--brand-left);
    transform:translateX(var(--brand-shift-x));
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:var(--brand-gap);
  }

  .brand-logo{
    width:var(--logo-size);
    height:var(--logo-size);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
    animation:melayang 3.6s ease-in-out infinite;
  }

  @keyframes melayang{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }

  .brand-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:var(--title-size);
    line-height:1;
    letter-spacing:.14em;
    text-align:center;
    color:#ffffff;
    text-shadow:0 2px 10px rgba(0,0,0,.45);
    white-space:nowrap;
  }

  .brand-title span{
    display:block;
    font-family:'Rajdhani',sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.55em;
    color:#bcd2ff;
    margin-top:3px;
    text-transform:uppercase;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="header">
      <div class="diagonal-shape2"></div>
      <div class="diagonal-shape"></div>
      <div class="dot-grid"></div>

      <div class="header-brand">
        <svg class="brand-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#bcd2ff"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="42" fill="none" stroke="url(#lg1)" stroke-width="4"/>
          <path d="M32 56 L46 40 L58 50 L70 34" fill="none" stroke="url(#lg1)"
                stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M58 34 H70 V46" fill="none" stroke="url(#lg1)"
                stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="32" cy="56" r="4.5" fill="url(#lg1)"/>
        </svg>

        <div class="brand-title">TOP ELEVEN GUIDE<span>Panduan Strategi</span></div>
      </div>

      <div class="header-bar"></div>
    </div>

    <a class="streak-card app-link" href="https://manager.topeleven.com/id/top-eleven-daily-streak">
      <div class="streak-glow"></div>
      <div class="streak-icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 8 C50 8 26 34 26 58 C26 76 38 90 50 90 C62 90 74 76 74 58 C74 46 66 38 62 32 C62 44 54 48 50 44 C46 40 48 30 50 24 C42 30 38 40 38 50 C38 60 44 66 50 66 C56 66 60 61 60 55"
                fill="#ffffff" stroke="none"/>
        </svg>
      </div>
      <div class="streak-text">
        <div class="streak-title-row">
          <div class="streak-title">Login Daily Streak Top Eleven</div>
        </div>
        <div class="streak-sub">Klaim hadiah login harianmu</div>
      </div>
      <div class="streak-arrow-wrap">
        <svg class="streak-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6l6 6-6 6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </a>

    <div class="card">
      <div class="card-title">Fitur Utama</div>
      <div class="empty-area">
        <div class="menu-grid">
          <a class="menu-card app-link" href="assets/keylog.html">
            <div class="menu-icon-wrap">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="lgIcon" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="var(--biru-cerah)"/>
                    <stop offset="100%" stop-color="var(--biru)"/>
                  </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="46" fill="url(#lgIcon)"/>
                <circle cx="50" cy="40" r="15" fill="#ffffff"/>
                <path d="M20 84 C20 62 34 54 50 54 C66 54 80 62 80 84 Z" fill="#ffffff"/>
                <g transform="translate(70,28)">
                  <path d="M10 0 L12.5 6.8 L20 7.3 L14.2 11.9 L16.2 19 L10 15 L3.8 19 L5.8 11.9 L0 7.3 L7.5 6.8 Z" fill="#ffd23f"/>
                </g>
              </svg>
            </div>
            <div class="menu-card-title">Kalkulator OVR</div>
          </a>
        </div>
      </div>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const phone = document.querySelector('.phone');
    phone.style.animationDelay = '0.05s';

    document.querySelectorAll('.app-link[href]').forEach(card => {
      card.addEventListener('click', function(e){
        e.preventDefault();
        const target = this.getAttribute('href');
        this.classList.add('menu-card-tap');
        setTimeout(() => { window.location.href = target; }, 160);
      });
    });
  });
</script>
</body>
</html>
